name: Naxclow Local
version: "0.5.3"
slug: naxclow_local
description: Server local pentru sonerii pe platforma Naxclow (app X Smart Home) - alertă + poză în HA, fără cloud
url: https://github.com/jeanvaljan/ha-pppp-addons
arch: [amd64, aarch64, armv7]
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
map:
  - homeassistant_config:rw
  - share:rw
options:
  mode: local
  auto_stream: 20
  max_stream: 60
  upstream_http: 47.251.54.125
  upstream_tcp: "107.149.136.10:29838"
  tcp_host: ""
  tcp_port: 29838
  tcp_capture: true
  log_level: info
schema:
  mode: list(local|proxy)
  auto_stream: int(0,120)
  max_stream: int(10,300)
  upstream_http: str
  upstream_tcp: str
  tcp_host: str?
  tcp_port: port
  tcp_capture: bool
  log_level: list(debug|info|warning|error)
