name: Naxclow Local
version: "0.1.0"
slug: naxclow_local
description: Server local pentru sonerii pe platforma Naxclow (app X Smart Home) - alertă + poză în HA, fără cloud
url: https://github.com/jeanvaljan/ha-pppp-addons
arch: [amd64, aarch64, armv7]
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
map:
  - homeassistant_config:rw
  - share:rw
options:
  tcp_host: ""
  tcp_port: 29838
  tcp_capture: true
  log_level: info
schema:
  tcp_host: str?
  tcp_port: port
  tcp_capture: bool
  log_level: list(debug|info|warning|error)
